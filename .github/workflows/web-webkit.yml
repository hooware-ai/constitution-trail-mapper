name: Web WebKit launch acceptance

# Runs the automated WebKit specs (webApp/tests/webkit, issue #41) on GitHub-hosted Linux. WebKit here is Playwright's
# build of the Safari engine: it is NOT iPhone Safari, a physical device, VoiceOver or a real GPS, and a green run is not
# launch acceptance (see docs/web/launch-acceptance.md). A separate workflow from "Web release check" and "Web Firestore
# rules", which are unchanged. No secrets, no deployment, no cloud access, no authentication; the specs run the app on its
# synthetic fixture network against owned loopback dev and production-header artifact servers.

on:
  pull_request:
    paths:
      - "webApp/**"
      - "webBridge/**"
      - "sharedLogic/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/web-webkit.yml"
  push:
    branches: [main, "codex/web-app"]
    paths:
      - "webApp/**"
      - "webBridge/**"
      - "sharedLogic/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/web-webkit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-webkit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webkit-profiles:
    name: WebKit profile (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Every configured profile still runs its entire suite and cold-start control.
    # Parallel jobs avoid charging three profiles to one 20-minute test step.
    strategy:
      fail-fast: false
      matrix:
        project: [webkit-desktop, webkit-iphone, webkit-iphone-se]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webApp/package-lock.json

      # Gradle still configures the Android modules, so it needs an SDK location. The hosted image ships one.
      - name: Point Gradle at the preinstalled Android SDK
        run: echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties

      - name: Locked install and WebKit with its system dependencies
        working-directory: webApp
        run: |
          npm ci
          npx playwright install --with-deps webkit

      # The specs run the real Kotlin routing core, so it is built from this checkout (the same task the release check uses).
      - name: Build the Kotlin core
        working-directory: webApp
        timeout-minutes: 20
        run: npm run build:core

      - name: WebKit specs (${{ matrix.project }})
        working-directory: webApp
        timeout-minutes: 20
        run: npm run test:webkit -- --project=${{ matrix.project }}
        env:
          CI: "true"

      - name: Build and check cold reload on the fixture artifact
        working-directory: webApp
        timeout-minutes: 10
        run: |
          npm run build
          npx playwright test -c playwright.webkit.dist.config.ts --project=${{ matrix.project }}
        env:
          CI: "true"

      - name: Verify the matrix covers every configured WebKit profile
        working-directory: webApp
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const workflow = readFileSync('../.github/workflows/web-webkit.yml', 'utf8');
          const literal = workflow.match(/^\s+project: \[([^\]]+)\]\s*$/m);
          assert.ok(literal, 'Expected one literal matrix project list');
          const declared = literal[1].split(',').map(name => name.trim());
          assert.equal(new Set(declared).size, declared.length, 'Duplicate WebKit profile');
          for (const config of ['playwright.webkit.config.ts', 'playwright.webkit.dist.config.ts']) {
            const report = JSON.parse(execFileSync(process.execPath, [
              'node_modules/@playwright/test/cli.js', 'test', '-c', config, '--list', '--reporter=json'
            ], { encoding: 'utf8' }));
            assert.deepEqual(report.config.projects.map(project => project.name).sort(), [...declared].sort(),
              'Matrix must cover every configured profile in ' + config);
            assert.ok(report.suites.length, 'Empty WebKit test plan');
          }
          NODE

      - name: Upload traces on failure (synthetic data only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-test-results-${{ matrix.project }}
          path: webApp/test-results
          retention-days: 7
          if-no-files-found: ignore

  # Keep the existing required check name; cancelled/skipped/failed profiles fail closed.
  webkit-specs:
    name: WebKit launch-acceptance specs
    needs: webkit-profiles
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every WebKit profile to succeed
        env:
          PROFILE_RESULT: ${{ needs.webkit-profiles.result }}
        run: test "$PROFILE_RESULT" = success
